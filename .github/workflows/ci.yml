name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          cache: true
      - name: Check formatting
        run: test -z "$(gofmt -l *.go)"
      - name: Test
        run: go test ./...
      - name: Race detector
        run: go test -race ./...
      - name: Vet
        run: go vet ./...
      - name: Static build
        run: CGO_ENABLED=0 go build -trimpath -o /tmp/loop-event-bridge .
  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate Swarm stack configuration
        run: |
          BRIDGE_IMAGE=example.invalid/bridge:ci BRIDGE_DOMAIN=bridge.example \
          TRAEFIK_NETWORK=traefik-public TRAEFIK_ENTRYPOINT=websecure \
          TRAEFIK_CERT_RESOLVER=letsencrypt BRIDGE_NODE_LABEL=primary \
          BRIDGE_DATA_VOLUME=bridge-ci-data OWNER_PASSWORD_SECRET=bridge-ci-owner \
          GITHUB_TOKEN_SECRET=bridge-ci-github GITHUB_ACCOUNT=ci-example \
          OAUTH_CLIENT_ID=ci-public OAUTH_REDIRECT_URI=https://client.example/callback \
          docker stack config --compose-file stack.yaml > /dev/null
      - name: Build container image without publishing
        run: docker build --pull --tag loop-event-bridge:ci .
      - name: Offline container smoke test
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' 'local-only-ci-owner-passphrase-000000000000' > "$RUNNER_TEMP/bridge-owner-password"
          chmod 644 "$RUNNER_TEMP/bridge-owner-password"
          trap 'docker rm -f bridge-smoke >/dev/null 2>&1 || true; rm -f "$RUNNER_TEMP/bridge-owner-password"' EXIT
          docker run --detach --name bridge-smoke --network none --read-only \
            --cap-drop ALL --security-opt no-new-privileges:true \
            --tmpfs /data:uid=65532,gid=65532,mode=0700 \
            --mount "type=bind,src=$RUNNER_TEMP/bridge-owner-password,dst=/run/secrets/owner_password,readonly" \
            --env GITHUB_ACCOUNT=ci-example \
            --env PUBLIC_URL=https://bridge.example \
            --env OAUTH_CLIENT_ID=local-ci-client \
            --env OAUTH_REDIRECT_URI=https://client.example/callback \
            --env OWNER_PASSWORD_FILE=/run/secrets/owner_password \
            loop-event-bridge:ci
          for attempt in $(seq 1 30); do
            if docker exec bridge-smoke /loop-event-bridge healthcheck; then
              echo 'Offline non-root container startup and healthcheck passed'
              exit 0
            fi
            sleep 1
          done
          docker logs bridge-smoke
          exit 1
